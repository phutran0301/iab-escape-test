<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Mở app — open.html v7</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 20px;text-align:center}
.ver{display:inline-block;background:#22c55e;color:#04210f;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0 0 8px}
#st{font-size:1.05rem;margin:16px 0;min-height:1.4em;color:#e2e8f0}
#st.ok{color:#22c55e;font-weight:700}
#st.fail{color:#f87171;font-weight:700}
.btn{display:none;max-width:320px;width:100%;margin:10px auto;padding:16px 20px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem}
.btn.visible{display:block}
.btn.back{background:#334155}
#debug{margin-top:auto;padding-top:24px;width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;font-size:.72rem;color:#cbd5e1;word-break:break-all;white-space:pre-wrap;text-align:left}
#debug b{color:#f8fafc}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;color:#94a3b8;margin:8px 0;word-break:break-all}
</style>
</head>
<body>
<span class="ver">v7</span>
<h1>Landing mở app (kiểu VietQR)</h1>
<p class="code" id="schemeLabel"></p>
<p id="st" aria-live="polite">Đang mở app…</p>
<a class="btn" id="open" href="#">Mở ứng dụng</a>
<a class="btn back" id="back" href="./">Quay lại trang test</a>
<div id="debug"></div>
<script>
(function(){
var params=new URLSearchParams(location.search);
var failed=params.get("failed")==="1";
var scheme=params.get("scheme")||"cake.vn://";
try{scheme=decodeURIComponent(scheme);}catch(e){}
var ua=navigator.userAgent||"";
var inApp=/MessengerForiOS|Orca-Android|FB_IAB|FBAN|FBAV|FBIOS|FB4A|Instagram|Zalo| Line\//i.test(ua);
var isAndroid=/Android/i.test(ua);
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
document.getElementById("schemeLabel").textContent="scheme = "+scheme;
document.getElementById("debug").innerHTML="<b>Version:</b> v7 open.html\n<b>User agent:</b> "+esc(ua)+"\n<b>Platform:</b> "+esc(navigator.platform||"")+"\n<b>In-app:</b> "+(inApp?"yes":"no")+"\n<b>Android:</b> "+(isAndroid?"yes":"no")+"\n<b>URL:</b> "+esc(location.href)+"\n<b>Scheme:</b> "+esc(scheme);

var st=document.getElementById("st");
var openBtn=document.getElementById("open");
var backBtn=document.getElementById("back");
openBtn.href=scheme;
backBtn.classList.add("visible");

if(failed){
  st.className="fail";
  st.textContent="Không mở được – có thể chưa cài app (fallback Android)";
  openBtn.classList.add("visible");
  return;
}

function schemeName(s){
  var m=String(s).match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
  return m?m[1]:"app";
}

if(isAndroid){
  var name=schemeName(scheme);
  var isCakeDefault=/^cake\.vn:\/\//i.test(scheme);
  var fallbackUrl=location.href.split("?")[0]+"?failed=1&scheme="+encodeURIComponent(scheme);
  var intent;
  if(isCakeDefault){
    intent="intent://#Intent;scheme=cake.vn;package=xyz.be.cake;S.browser_fallback_url="+encodeURIComponent(fallbackUrl)+";end";
  }else{
    intent="intent://#Intent;scheme="+encodeURIComponent(name)+";S.browser_fallback_url="+encodeURIComponent(fallbackUrl)+";end";
  }
  st.textContent="Đang mở app (Android Intent)…";
  document.getElementById("debug").innerHTML+="\n<b>Intent:</b> "+esc(intent);
  location.href=intent;
  openBtn.href=intent;
  setTimeout(function(){openBtn.classList.add("visible");},1500);
  setTimeout(function(){
    if(!document.hidden){
      st.className="fail";
      st.textContent="Không mở được – có thể chưa cài app";
      openBtn.classList.add("visible");
    }
  },4000);
  return;
}

var left=false;
function gone(){left=true;st.className="ok";st.textContent="App đã mở";}
document.addEventListener("visibilitychange",function(){if(document.hidden)gone();});
window.addEventListener("pagehide",gone);

function fail(){
  if(left||document.hidden)return;
  st.className="fail";
  st.textContent="Không mở được – có thể chưa cài app";
  openBtn.classList.add("visible");
}

st.textContent="Đang mở app…";
openBtn.href=scheme;
location.href=scheme;
setTimeout(function(){openBtn.classList.add("visible");},1500);
setTimeout(fail,4000);
})();
</script>
</body>
</html>
