<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Mở app — open.html v12</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 20px;text-align:center}
.ver{display:inline-block;background:#22c55e;color:#04210f;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:12px}
h1{font-size:1.2rem;margin:0 0 8px}
#st{font-size:1.05rem;margin:16px 0;min-height:1.4em;color:#e2e8f0}
#st.ok{color:#22c55e;font-weight:700}
#st.fail{color:#f87171;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:10px;max-width:320px;width:100%;justify-content:center;margin:14px auto;padding:14px 22px;border-radius:999px;background:#ec1e79;color:#fff;text-decoration:none;font-weight:800;font-size:1.1rem;box-shadow:0 8px 24px rgba(236,30,121,.4);border:none;cursor:pointer}
.pill img{width:24px;height:24px;border-radius:7px;flex:none}
.btn-back{display:none;max-width:320px;width:100%;margin:8px auto;padding:12px 20px;border-radius:12px;background:#334155;color:#e2e8f0;text-decoration:none;font-weight:600}
.btn-back.visible{display:block}
#debug{margin-top:auto;padding-top:24px;width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;font-size:.72rem;color:#cbd5e1;word-break:break-all;white-space:pre-wrap;text-align:left}
#debug b{color:#f8fafc}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:#94a3b8;margin:8px 0;word-break:break-all}
</style>
</head>
<body>
<span class="ver">v12</span>
<h1>Landing mở app (kiểu VietQR)</h1>
<p id="st" aria-live="polite">Bấm nút để mở app</p>
<button class="pill" id="open" type="button"><img id="logo" src="./cake-logo.png" alt="Cake" />Chuyển 120.000đ</button>
<p><a href='cake.vn://' style="display:inline-block;padding:8px 16px;border-radius:999px;background:#334155;color:#fff;text-decoration:none;font-size:.9rem">Mở CAKE</a></p>
<a class="btn-back" id="back" href="./">Quay lại trang test</a>
<p class="code" id="schemeLabel"></p>
<div id="debug"></div>
<script>
(function(){
var DEFAULT_SCHEME="cake.vn://applink?targetPage=QRPay&source=App&qrContent=00020101021238630010A000000727013300069710250119PSS26259131000000070208QRIBFTTA530370454061200005802VN62230819MCRSskfyB%20com%20chien630446A8&callbackurl=ngo://start";
var params=new URLSearchParams(location.search);
var failed=params.get("failed")==="1";
var rawScheme=params.get("scheme");
var scheme=rawScheme?decodeURIComponent(rawScheme):DEFAULT_SCHEME;
var ua=navigator.userAgent||"";
var inApp=/MessengerForiOS|Orca-Android|FB_IAB|FBAN|FBAV|FBIOS|FB4A|Instagram|Zalo| Line\//i.test(ua);
var isAndroid=/Android/i.test(ua);
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
var st=document.getElementById("st");
var openBtn=document.getElementById("open");
var backBtn=document.getElementById("back");
backBtn.classList.add("visible");
document.getElementById("schemeLabel").textContent=scheme;
document.getElementById("debug").innerHTML="<b>Version:</b> v12 open.html\n<b>User agent:</b> "+esc(ua)+"\n<b>Platform:</b> "+esc(navigator.platform||"")+"\n<b>In-app:</b> "+(inApp?"yes":"no")+"\n<b>Android:</b> "+(isAndroid?"yes":"no")+"\n<b>URL:</b> "+esc(location.href)+"\n<b>Scheme:</b> "+esc(scheme);

if(failed){
  st.className="fail";
  st.textContent="Không mở được – có thể chưa cài app";
  return;
}

function schemeName(s){var m=String(s).match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);return m?m[1]:"app";}
function isCakeDefault(s){return /^cake\.vn:\/\//i.test(s);}
function buildIntent(s){
  // keep host+path+query from scheme after "cake.vn://" or "<scheme>://"
  var afterScheme=s.replace(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//,"");
  var fb=location.href.split("?")[0]+"?failed=1&scheme="+encodeURIComponent(s);
  if(isCakeDefault(s)){
    return "intent://"+afterScheme+"#Intent;scheme=cake.vn;package=xyz.be.cake;S.browser_fallback_url="+encodeURIComponent(fb)+";end";
  }
  return "intent://"+afterScheme+"#Intent;scheme="+schemeName(s)+";S.browser_fallback_url="+encodeURIComponent(fb)+";end";
}

var left=false,tapped=false;
function gone(){left=true;st.className="ok";st.textContent="App đã mở";}
document.addEventListener("visibilitychange",function(){if(document.hidden)gone();});
window.addEventListener("pagehide",gone);

function ladder(){
  tapped=true;left=false;
  var target=isAndroid?buildIntent(scheme):scheme;
  st.className="";st.textContent="Đang mở app…";
  document.getElementById("debug").innerHTML+="\n<b>Opened:</b> "+esc(target);
  location.href=target;
  setTimeout(function(){
    if(!left&&!document.hidden){
      document.getElementById("debug").innerHTML+="\n<b>Fallback:</b> cake.vn://";
      location.href="cake.vn://";
      st.className="ok";st.textContent="Đã mở CAKE (không điền sẵn) – quét QR trong app";
    }
  },1500);
}
openBtn.addEventListener("click",ladder);
// v12: auto open only with ?auto=1 and NOT in-app browser
var auto=params.get("auto")==="1";
if(auto&&!inApp){st.textContent="Đang tự mở app… (bấm nút nếu không mở)";setTimeout(ladder,300);}
else if(auto&&inApp){st.textContent="Trong in-app browser: không tự mở, hãy bấm nút";}
})();
</script>
</body>
</html>
