<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test mở trình duyệt</title>
<meta property="og:title" content="Test mở trình duyệt" />
<meta property="og:description" content="Nhấn vào để mở trang trong trình duyệt hệ thống của thiết bị." />
<meta property="og:type" content="website" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: #94a3b8; line-height: 1.5; margin: 6px 0; }
  .btn {
    display: inline-block;
    width: 100%;
    max-width: 360px;
    padding: 16px 20px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .hidden { display: none !important; }
  #success h1 { color: #22c55e; }
  #debug {
    margin-top: 24px;
    max-width: 420px;
    width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.72rem;
    text-align: left;
    color: #cbd5e1;
    word-break: break-all;
    white-space: pre-wrap;
  }
  #debug b { color: #f8fafc; }
  #overlay {
    position: fixed;
    top: 0; right: 0;
    padding: 16px 20px;
    background: rgba(37,99,235,0.95);
    color: #fff;
    border-bottom-left-radius: 14px;
    max-width: 80%;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  #overlay .arrow { font-size: 1.6rem; }
  .card { max-width: 420px; width: 100%; }
</style>
</head>
<body>

<div id="overlay" class="hidden">
  <div class="arrow">↗</div>
  Bấm ⋯ góc trên bên phải → <b>Mở trong trình duyệt</b>
</div>

<div id="inapp" class="card hidden">
  <h1>Mở trang này trong trình duyệt</h1>
  <p>Trình duyệt trong ứng dụng không phù hợp. Nhấn nút bên dưới để mở bằng trình duyệt hệ thống.</p>
  <button id="btnOpen" class="btn btn-primary">Mở trong trình duyệt</button>
  <a id="btnChrome" class="btn btn-secondary hidden">Mở bằng Chrome</a>
  <button id="btnCopy" class="btn btn-secondary">Copy link</button>
</div>

<div id="success" class="card hidden">
  <h1>Đã mở bằng trình duyệt thiết bị ✅</h1>
  <p id="browserInfo"></p>
</div>

<div id="debug"></div>

<script>
(function () {
  var ua = navigator.userAgent || "";
  var IAB_RE = /MessengerForiOS|Orca-Android|FB_IAB|FBAN|FBAV|FBIOS|FB4A|Instagram|Zalo| Line\//i;
  var inApp = IAB_RE.test(ua);

  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var isInstagram = /Instagram/i.test(ua);

  var params = new URLSearchParams(window.location.search);
  var escaped = params.get("escaped") === "1";

  var platform = isIOS ? "iOS" : (isAndroid ? "Android" : "Desktop/Other");

  function detectBrowser() {
    if (/CriOS/i.test(ua)) return "Chrome (iOS)";
    if (/FxiOS/i.test(ua)) return "Firefox (iOS)";
    if (/EdgiOS/i.test(ua)) return "Edge (iOS)";
    if (/Edg\//i.test(ua)) return "Edge";
    if (/OPR\//i.test(ua)) return "Opera";
    if (/Chrome\//i.test(ua)) return "Chrome";
    if (/Firefox\//i.test(ua)) return "Firefox";
    if (/Safari\//i.test(ua)) return "Safari";
    return "Không xác định";
  }

  function buildTarget() {
    var u = new URL(window.location.href);
    u.searchParams.set("escaped", "1");
    return u.toString();
  }
  var target = buildTarget();

  // Debug box
  document.getElementById("debug").innerHTML =
    "<b>DEBUG</b>\n" +
    "UA: " + ua + "\n" +
    "Platform: " + platform + "\n" +
    "inApp: " + (inApp ? "yes" : "no") + "\n" +
    "escaped: " + (escaped ? "1" : "(none)");

  function iosNoScheme(t) { return t.replace(/^https?:\/\//, ""); }

  function doRedirect() {
    try {
      if (isIOS) {
        if (isInstagram) {
          window.location.href = "instagram://extbrowser/?url=" + encodeURIComponent(target);
        } else {
          window.location.href = "x-safari-" + target;
        }
      } else if (isAndroid) {
        window.location.href = "intent://" + iosNoScheme(target) + "#Intent;scheme=https;end";
      } else {
        window.location.href = target;
      }
    } catch (e) {}
  }

  if (inApp && !escaped) {
    // show in-app UI as fallback, then auto-redirect once
    doRedirect();
    setTimeout(function () {
      showInApp();
    }, 1500);
  } else if (inApp && escaped) {
    // still in-app after a redirect attempt
    showInApp();
  } else {
    showSuccess();
  }

  function showInApp() {
    document.getElementById("inapp").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");

    document.getElementById("btnOpen").addEventListener("click", function () {
      doRedirect();
    });

    if (isIOS) {
      var c = document.getElementById("btnChrome");
      c.classList.remove("hidden");
      c.setAttribute("href", "googlechrome://" + iosNoScheme(target));
    }

    document.getElementById("btnCopy").addEventListener("click", function () {
      var link = target;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          alert("Đã copy link!");
        }, function () { legacyCopy(link); });
      } else {
        legacyCopy(link);
      }
    });
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); alert("Đã copy link!"); }
    catch (e) { alert("Không copy được, hãy copy thủ công: " + text); }
    document.body.removeChild(ta);
  }

  function showSuccess() {
    document.getElementById("success").classList.remove("hidden");
    document.getElementById("browserInfo").innerHTML =
      "Trình duyệt: <b>" + detectBrowser() + "</b> &middot; Nền tảng: <b>" + platform + "</b><br><br>" +
      "<span style='font-size:0.75rem;color:#64748b'>" + ua + "</span>";
  }
})();
</script>
</body>
</html>
