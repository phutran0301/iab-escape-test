<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test mở trình duyệt v3</title>
<meta property="og:title" content="Test mở trình duyệt v3" />
<meta property="og:description" content="Thử từng cách mở trang trong trình duyệt ngoài." />
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.3rem;margin:0 0 4px}
.ver{display:inline-block;background:#22c55e;color:#04210f;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:12px}
.card{max-width:440px;width:100%}
ol{padding-left:0;list-style:none;margin:0}
li{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px;margin:10px 0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;background:#2563eb;color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:#94a3b8;margin-top:6px;word-break:break-all}
.st{font-size:.8rem;color:#facc15;margin-top:4px;min-height:1em}
#debug{margin-top:16px;width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;font-size:.72rem;color:#cbd5e1;word-break:break-all;white-space:pre-wrap}
#debug b{color:#f8fafc}
</style>
</head>
<body>
<div class="card">
<h1>Test mở trình duyệt ngoài</h1>
<span class="ver">v3</span>
<p style="color:#94a3b8;font-size:.85rem">Bấm lần lượt từng nút, ghi lại nút nào mở được Safari/trình duyệt ngoài. Không tự động chuyển hướng.</p>
<h2 style="font-size:1.1rem;margin:16px 0 4px">Mở app (test popup)</h2>
<ol id="list3"></ol>
<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Các nút v2 (mở trình duyệt ngoài) — đã thử, không được</summary>
<ol id="list"></ol>
</details>
</div>
<div id="debug"></div>
<script>
(function(){
var pageUrl="https://phutran0301.github.io/iab-escape-test/";
var bare=pageUrl.replace(/^https:\/\//,"");
function u(n){return pageUrl+"?from="+n;}
function ub(n){return bare+"?from="+n;}
var tests=[
 {label:"Mở Safari (location.href x-safari-)",code:"location.href = 'x-safari-' + pageUrl",run:function(){location.href="x-safari-"+u(1);}},
 {label:"Mở Safari (window.open x-safari-)",code:"window.open('x-safari-' + pageUrl, '_blank')",run:function(){window.open("x-safari-"+u(2),"_blank");}},
 {label:"Mở Safari (thẻ <a> x-safari-)",code:"<a href='x-safari-https://phutran0301.github.io/iab-escape-test/?from=3' target='_blank'>",href:"x-safari-https://phutran0301.github.io/iab-escape-test/?from=3",target:"_blank"},
 {label:"Mở bằng Chrome",code:"'googlechromes://' + url (bỏ https://)",run:function(){location.href="googlechromes://"+ub(4);}},
 {label:"Mở bằng Firefox",code:"'firefox://open-url?url=' + encodeURIComponent(pageUrl)",run:function(){location.href="firefox://open-url?url="+encodeURIComponent(u(5));}},
 {label:"Mở bằng Edge",code:"'microsoft-edge-https://' + url (bỏ https://)",run:function(){location.href="microsoft-edge-https://"+ub(6);}},
 {label:"Mở tab Safari (com-apple-mobilesafari-tab:)",code:"'com-apple-mobilesafari-tab:' + pageUrl",run:function(){location.href="com-apple-mobilesafari-tab:"+u(7);}},
 {label:"Mở file PDF (dl.pdf)",code:"<a href='dl.pdf'>",href:"dl.pdf"},
 {label:"Mở qua Instagram extbrowser",code:"'instagram://extbrowser/?url=' + encodeURIComponent(pageUrl)",run:function(){location.href="instagram://extbrowser/?url="+encodeURIComponent(u(9));}},
 {label:"Copy link",code:"Bấm ⋯ góc trên → Mở trong trình duyệt",copy:true}
];
var list=document.getElementById("list");
tests.forEach(function(t,i){
 var n=i+1,li=document.createElement("li"),el;
 if(t.href){el=document.createElement("a");el.href=t.href;if(t.target)el.target=t.target;}
 else{el=document.createElement("button");}
 el.className="btn";el.textContent=n+". "+t.label;
 var code=document.createElement("div");code.className="code";code.textContent=t.code;
 var st=document.createElement("div");st.className="st";
 el.addEventListener("click",function(){
  st.textContent="đã bấm #"+n+" ("+new Date().toLocaleTimeString()+")";
  if(t.copy){
   var done=function(ok){st.textContent="đã bấm #"+n+(ok?" — đã copy link":" — copy lỗi, link: "+pageUrl);};
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(pageUrl).then(function(){done(true)},function(){fallback()});}else fallback();
   function fallback(){var ta=document.createElement("textarea");ta.value=pageUrl;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);done(ok);}
  } else if(t.run){ try{t.run();}catch(e){st.textContent+=" — lỗi: "+e.message;} }
 });
 li.appendChild(el);li.appendChild(code);li.appendChild(st);
 if(t.copy){var note=document.createElement("div");note.className="code";note.style.color="#e2e8f0";note.textContent="Bấm ⋯ góc trên → Mở trong trình duyệt";li.appendChild(note);}
 list.appendChild(li);
});
var t3=[
 [11,"Mở Zalo (zalo://)","zalo://"],
 [12,"Mở Shopee (shopee://)","shopee://"],
 [13,"Mở YouTube (youtube://)","youtube://"],
 [14,"Mở Instagram (instagram://app)","instagram://app"],
 [15,"Universal link YouTube","https://www.youtube.com/watch?v=dQw4w9WgXcQ"],
 [16,"Universal link Spotify","https://open.spotify.com/"],
 [17,"Universal link Shopee","https://shopee.vn/"],
 [18,"Universal link Zalo","https://zalo.me/"],
 [19,"JS location.href = 'zalo://'",null,function(){location.href="zalo://";}],
 ["20a","OneLink MoMo (onelink.momo.vn)","https://onelink.momo.vn/WZPv/wUJGeguQ"],
 ["20b","OneLink Grab (grab.onelink.me)","https://grab.onelink.me/2695613898?pid=inappsharing&af_web_dp=https%3A%2F%2Fwww.grab.com%2Fdownload"]
];
var l3=document.getElementById("list3");
t3.forEach(function(t){
 var n=t[0],li=document.createElement("li"),el;
 if(t[2]){el=document.createElement("a");el.href=t[2];}else{el=document.createElement("button");}
 el.className="btn";el.textContent=n+". "+t[1];
 var code=document.createElement("div");code.className="code";code.textContent=t[2]?"<a href='"+t[2]+"'>":"location.href = 'zalo://'";
 var st=document.createElement("div");st.className="st";
 el.addEventListener("click",function(){st.textContent="đã bấm #"+n+" ("+new Date().toLocaleTimeString()+")";if(t[3]){try{t[3]();}catch(e){st.textContent+=" — lỗi: "+e.message;}}});
 li.appendChild(el);li.appendChild(code);li.appendChild(st);l3.appendChild(li);
});
var ua=navigator.userAgent||"";
var inApp=/MessengerForiOS|Orca-Android|FB_IAB|FBAN|FBAV|FBIOS|FB4A|Instagram|Zalo| Line\//i.test(ua);
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
document.getElementById("debug").innerHTML="<b>Version:</b> v3\n<b>User agent:</b> "+esc(ua)+"\n<b>Platform:</b> "+esc(navigator.platform||"")+"\n<b>In-app:</b> "+(inApp?"yes":"no")+"\n<b>URL:</b> "+esc(location.href);
})();
</script>
</body>
</html>
